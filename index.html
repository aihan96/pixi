<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pixi</title>
  </head>
  <body>
    <div id="app"></div>

    <div class="area-info">
      <span id="area-info-label"></span>
    </div>

    <div class="controls">
      <div class="control-group">
        <span>Shapes / sec </span>
        <button id="rate-decrease">−</button>
        <strong id="rate-value"></strong>
        <button id="rate-increase">+</button>
      </div>
      <div class="control-group">
        <span>Gravity: </span>
        <button id="gravity-decrease">−</button>
        <strong id="gravity-value"></strong>
        <button id="gravity-increase">+</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
